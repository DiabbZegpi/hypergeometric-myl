name: Deploy Shinylive App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2  # Native Node 24 support clears the warning

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Enables ultra-fast binary package installations

      - name: Install System Dependencies for Base64 and Shinylive
        run: |
          # Pull pre-compiled binaries from Posit manager so installation never fails
          Rscript -e "install.packages('base64enc', repos='https://posit.co')"
          Rscript -e "install.packages('shinylive', repos='https://posit.co')"

      - name: Convert Shiny App to Static Files
        run: |
          Rscript -e "
            # Inject standard relative link pointing straight to the flat logo file
            favicon_html <- '<link rel=\"icon\" type=\"image/png\" href=\"logo.png\">'
            shinylive::export('R', 'site', include_in_head = favicon_html)
          "
          # Create the asset subdirectory for your game logo profiles
          mkdir -p site/assets
          
          # Copy all dynamic PNG brand logos into the asset subfolder
          cp R/*.png site/assets/
          
          # Copy the main browser tab icon directly into the root web folder
          cp R/logo.png site/

      - name: Setup Pages
        uses: actions/configure-pages@v5   # Native Node 24 support clears the warning

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4