name: Deploy Shinylive App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2  # Updated to explicitly support modern Node runners

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Shinylive Package
        run: |
          Rscript -e "install.packages('shinylive')"

      - name: Convert Shiny App to Static Files
        run: |
          Rscript -e "
            install.packages('base64enc')
            img_data <- base64enc::base64encode('R/logo.png')
            favicon_html <- paste0('<link rel=\"icon\" type=\"image/png\" href=\"data:image/png;base64,', img_data, '\">')
            shinylive::export('R', 'site', include_in_head = favicon_html)
          "
          # --- FIXED: Creates the matching asset folder on your live serverless website directory ---
          mkdir -p site/assets
          cp R/*.png site/assets/



      - name: Setup Pages
        uses: actions/configure-pages@v5   # Upgraded to native Node 24 support

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
