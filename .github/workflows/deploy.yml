name: Deploy Shinylive App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # --- FIXED: Uses native GitHub Action package installation handlers ---
      # This handles any network blocks cleanly, using official global CRAN mirrors automatically
      - name: Install Required Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            base64enc
            shinylive

      - name: Convert Shiny App to Static Files
        run: |
          Rscript -e "
            # Inject standard relative link pointing straight to the flat logo file
            favicon_html <- '<link rel=\"icon\" type=\"image/png\" href=\"logo.png\">'
            
            # Execute the serverless export using the natively installed packages
            shinylive::export('R', 'site', include_in_head = favicon_html)
          "
          # Build subdirectories and copy all assets into place
          mkdir -p site/assets
          cp R/*.png site/assets/
          cp R/logo.png site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4