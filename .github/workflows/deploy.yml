name: Deploy Shinylive App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Convert Shiny App to Static Files
        run: |
          Rscript -e "
            # 1. Install dependencies using fast pre-compiled binaries inside the active block
            install.packages('base64enc', repos='https://posit.co')
            install.packages('shinylive', repos='https://posit.co')
            
            # 2. Inject standard relative link pointing straight to the flat logo file
            favicon_html <- '<link rel=\"icon\" type=\"image/png\" href=\"logo.png\">'
            
            # 3. Execute the serverless export with the native packages now fully visible
            shinylive::export('R', 'site', include_in_head = favicon_html)
          "
          # 4. Build subdirectories and copy assets
          mkdir -p site/assets
          cp R/*.png site/assets/
          cp R/logo.png site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4